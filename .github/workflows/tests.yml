name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push cancela al anterior: interesa el resultado del último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # En su propio job para que el fallo diga "es de código" y no "ha fallado
      # la suite". Tarda menos de 20 s y sin levantar navegador.
      - name: Comprobar tipos
        run: npm run typecheck

      # Capa baja: lógica pura, sin navegador. Corre aquí en menos de un
      # segundo en vez de repetirse tres veces en la matriz.
      - name: Ejecutar las pruebas unitarias
        run: npx playwright test --project=unidad

      # Las reglas que sostienen lo que la documentación afirma: cero esperas
      # fijas, ningún test.only, ningún expect sin await, ningún test sin
      # asserts. Un expect sin await hace que el test pase siempre.
      - name: Comprobar reglas de la suite
        run: npm run lint

      # Casos, cifras, enlaces y anclajes. Una matriz de treinta casos se
      # desincroniza sola y eso no rompe ningún test.
      - name: Verificar la documentación
        run: npm run verificar

  e2e:
    name: E2E · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Si Firefox falla, WebKit tiene que ejecutarse igual.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Descargar el navegador costaba 29 s en Chromium, 23 en Firefox y 39 en
      # WebKit: más que ejecutar la suite. La clave sale del package-lock, así
      # que actualizar Playwright invalida la caché sola.
      # Ahorro medido: 7-15 s por job. Menos de lo esperado, porque las libs
      # del sistema se siguen instalando abajo y el techo lo pone apt.
      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      # Las libs del sistema viven fuera de ~/.cache, así que hay que ponerlas
      # aunque el navegador ya esté. Sin esto WebKit no arranca.
      - name: Asegurar las dependencias del sistema
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      # `blob` es el formato intermedio para unir luego los tres navegadores;
      # `github` anota los fallos sobre el diff del PR. Van aquí y no en el
      # config porque --reporter sustituye a la configuración entera, y
      # ponerlo en los dos sitios haría creer que el config interviene en CI.
      - name: Ejecutar la suite
        run: npx playwright test --project=${{ matrix.project }} --reporter=blob,github

      - name: Guardar el reporte parcial
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 7

      # Trazas de los defectos, que se publican para recorrerlos en el visor.
      # Hace falta ejecución aparte con --trace=on: en la principal la traza va
      # en on-first-retry y un fallo *esperado* no reintenta. Con --output
      # propio para no pisar los resultados anteriores (error de la 1ª versión).
      - name: Capturar las trazas de los hallazgos
        if: ${{ matrix.project == 'chromium' && !cancelled() }}
        run: |
          npx playwright test --project=chromium --grep @hallazgo \
            --trace=on --output=trazas-salida --reporter=json > trazas.json
          node tools/nombrar-trazas.mjs trazas.json trazas

      - name: Guardar las trazas
        if: ${{ matrix.project == 'chromium' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trazas
          path: trazas/
          retention-days: 7

  reporte:
    name: Reporte unificado
    # `always()` para que el informe salga también cuando algo ha fallado,
    # que es cuando hace falta mirarlo.
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Recuperar los reportes parciales
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Unir los tres navegadores en un informe
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Recuperar las trazas de los hallazgos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trazas
          path: trazas

      # La raíz es una presentación en español y el informe pasa a /informe/.
      # Antes Pages servía el informe tal cual: un listado en inglés sin contexto.
      - name: Ensamblar el sitio
        run: node tools/preparar-sitio.mjs trazas

      - name: Publicar el sitio como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _sitio/
          retention-days: 30

  publicar-reporte:
    name: Publicar el informe en GitHub Pages
    # Solo desde main y solo en push: un pull request no debe sobrescribir el
    # informe publicado.
    #
    # `continue-on-error` a propósito: si Pages no está habilitado, este job
    # falla y la ejecución sigue en verde. La insignia debe decir si los tests
    # pasan, no si está montado el alojamiento.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [reporte]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Recuperar el sitio
        uses: actions/download-artifact@v4
        with:
          name: sitio
          path: _sitio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
