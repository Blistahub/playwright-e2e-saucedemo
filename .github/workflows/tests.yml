name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push que llega mientras se ejecuta el anterior cancela al anterior:
# el resultado que interesa es el del último commit, no el de todos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Un error de tipos se detecta en menos de veinte segundos y sin levantar
      # un solo navegador. Va en su propio job para que el fallo diga "es de
      # código", no "ha fallado algo en la suite".
      - name: Comprobar tipos
        run: npm run typecheck

      # La capa baja de la pirámide: la lógica pura de conversión de importes.
      # No abre navegador, así que corre aquí en menos de un segundo en lugar
      # de repetirse tres veces en la matriz comprobando siempre lo mismo.
      - name: Ejecutar las pruebas unitarias
        run: npx playwright test --project=unidad

      # Las reglas que sostienen lo que la documentación afirma sobre la suite:
      # cero esperas fijas, ningún test enfocado, ningún expect sin await y
      # ningún test sin aserciones. Una promesa sin await es el peor fallo
      # posible en un test, porque lo hace pasar siempre.
      - name: Comprobar reglas de la suite
        run: npm run lint

      # Comprueba que la documentación siga diciendo la verdad sobre la suite:
      # casos, cifras, enlaces y anclajes. No levanta navegadores ni toca la
      # red, así que cuesta segundos. Una matriz de treinta casos con
      # referencias cruzadas se desincroniza sola, y eso no rompe ningún test.
      - name: Verificar la documentación
        run: npm run verificar

  e2e:
    name: E2E · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Si Firefox falla, WebKit tiene que ejecutarse igual: sin esto se
      # cancelarían los demás y el reporte diría menos de lo que sabe.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Descargar el navegador costaba 29 s en Chromium, 23 s en Firefox y
      # 39 s en WebKit: más que ejecutar la suite. Se cachea por versión de
      # Playwright, con la clave derivada del package-lock, así que una
      # actualización de la dependencia invalida la caché por sí sola y nunca
      # se ejecuta contra un navegador que no corresponde.
      #
      # El ahorro medido es de 7 a 15 s por job, menos de lo que parecería:
      # los binarios dejan de descargarse, pero las bibliotecas del sistema
      # siguen instalándose abajo. El techo lo pone apt, no la descarga.
      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      # Las bibliotecas del sistema viven fuera de ~/.cache, así que la caché
      # no las trae: hay que asegurarlas aunque el navegador ya esté. Sin esto,
      # WebKit arrancaría contra un runner al que le faltan dependencias.
      - name: Asegurar las dependencias del sistema
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      # `blob` es el formato intermedio que permite unir después los tres
      # navegadores; `github` anota cada fallo sobre el diff del pull request.
      # Se pasan aquí y no en playwright.config.ts porque --reporter sustituye
      # a la configuración entera: declararlo en los dos sitios haría creer que
      # el config interviene en CI cuando no interviene.
      - name: Ejecutar la suite
        run: npx playwright test --project=${{ matrix.project }} --reporter=blob,github

      # El reporte "blob" es el formato intermedio que permite unir después
      # los resultados de los tres navegadores en un único informe HTML.
      - name: Guardar el reporte parcial
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 7

      # Las trazas de los defectos conocidos, que son lo que se publica para
      # que cualquiera pueda recorrerlos paso a paso en el visor oficial.
      #
      # Hace falta una ejecución aparte con --trace=on: en la principal la
      # traza está en on-first-retry y un fallo *esperado* no reintenta, así
      # que nunca se generaría. Va con --output propio para no pisar los
      # resultados de la ejecución anterior, que es exactamente el error que
      # se cometió al montar esto la primera vez.
      - name: Capturar las trazas de los hallazgos
        if: ${{ matrix.project == 'chromium' && !cancelled() }}
        run: |
          npx playwright test --project=chromium --grep @hallazgo \
            --trace=on --output=trazas-salida --reporter=json > trazas.json
          node tools/nombrar-trazas.mjs trazas.json trazas

      - name: Guardar las trazas
        if: ${{ matrix.project == 'chromium' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trazas
          path: trazas/
          retention-days: 7

  reporte:
    name: Reporte unificado
    # `always()` para que el informe se genere también —sobre todo— cuando
    # algún navegador ha fallado: es justo cuando hace falta mirarlo.
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Recuperar los reportes parciales
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Unir los tres navegadores en un informe
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Recuperar las trazas de los hallazgos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trazas
          path: trazas

      # La raíz del sitio es una presentación en español; el informe pasa a
      # /informe/ y las evidencias y trazas cuelgan al lado. Antes Pages servía
      # el informe de Playwright directamente: útil como constancia, pero quien
      # abría el enlace se encontraba un listado en inglés sin contexto.
      - name: Ensamblar el sitio
        run: node tools/preparar-sitio.mjs trazas

      - name: Publicar el sitio como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _sitio/
          retention-days: 30

  publicar-reporte:
    name: Publicar el informe en GitHub Pages
    # Solo desde main y solo en push: un pull request no debe sobrescribir el
    # informe publicado.
    #
    # `continue-on-error` es deliberado: si el repositorio todavía no tiene
    # Pages habilitado, este job falla y la ejecución sigue en verde. El estado
    # de la insignia debe responder a si los tests pasan, no a si está
    # configurado el alojamiento del informe.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [reporte]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Recuperar el sitio
        uses: actions/download-artifact@v4
        with:
          name: sitio
          path: _sitio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
